# CI 快速门禁 — 每次 push / pull_request 触发
#
# 设计目标: 在 ~5 分钟内给出 PR 是否可合并的信号。按成本/风险分两个 job:
#   1. guard      — 纯源码扫描的架构守护，编译前先跑（最快反馈，~30s）
#   2. build-test — Debug 构建 + 分层 CTest 硬门禁
#
# job 间解耦: guard 不依赖编译产物，即使 build-test 挂了 guard 的结果仍可见，
# 便于快速定位是架构问题还是代码问题。build-test 内编译一次，先跑绿色门禁
# （阻断），再跑完整 unit 分区，避免重复编译。
#
# 平台: 仅 macOS（macos-14, arm64）。Windows conan 路径 JSBSim 来源待核实，留后续。
# 详见 docs/ci.md。
#
# 本地复现（见 docs/ci.md "本地复现" 一节）:
#   bash scripts/bootstrap_conan.sh llvm-ninja-debug
#   cmake --preset llvm-ninja-debug && cmake --build --preset llvm-ninja-debug
#   ctest --test-dir build/llvm-ninja-debug-local -L contract --output-on-failure -j4
#   ctest --test-dir build/llvm-ninja-debug-local -L ci_required --output-on-failure -j4
#   ctest --test-dir build/llvm-ninja-debug-local -L unit --output-on-failure -j4

name: CI

on:
  push:
    branches: [main, codex/optimize]
  pull_request:
    branches: [main]
  workflow_dispatch: # 允许手动触发，便于调试

# 同一分支新提交时取消旧的运行，节省 runner 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Conan 缓存 key 基于此文件的依赖清单哈希；改动 conanfile.py 会自动重建缓存
  CONAN_CACHE_KEY: ${{ hashFiles('conanfile.py') }}
  PRESET: llvm-ninja-debug

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Job 1: guard — 架构守护，编译前先跑（最快反馈）
  # 跑 -L contract: 17 个 cmake 守护脚本（include 方向/命名/API 边界等）+ contract gtest
  # 这些检查只读源码，不依赖编译产物，是项目"可执行架构规则"的核心。
  # ─────────────────────────────────────────────────────────────────────
  guard:
    name: Guard (contract)
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Conan 2.x
        run: pip install conan

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ env.CONAN_CACHE_KEY }}-debug

      - name: Bootstrap Conan (generate toolchain)
        run: bash scripts/bootstrap_conan.sh ${{ env.PRESET }}

      - name: Configure
        run: cmake --preset ${{ env.PRESET }}

      - name: Run contract guards
        run: ctest --test-dir build/llvm-ninja-debug-local -L contract --output-on-failure -j 4

  # ─────────────────────────────────────────────────────────────────────
  # Job 2: build-test — Debug 构建 + 测试门禁
  # 编译一次，分两轮跑测试:
  #   (a) 通用快速门禁: ci_required（replay/integration/public API/SAR guards）
  #   (b) 全量 unit 分区；两轮任一失败均阻断 PR。
  # ─────────────────────────────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Conan 2.x
        run: pip install conan

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ env.CONAN_CACHE_KEY }}-debug

      - name: Bootstrap Conan (generate toolchain)
        run: bash scripts/bootstrap_conan.sh ${{ env.PRESET }}

      - name: Configure
        run: cmake --preset ${{ env.PRESET }}

      - name: Build
        run: cmake --build --preset ${{ env.PRESET }} -j 4

      - name: Verify installed package consumer
        run: |
          cmake --install build/llvm-ninja-debug-local
          cmake -S tests/consumer -B build/consumer/llvm-ninja-debug -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_TOOLCHAIN_FILE=$PWD/build/llvm-ninja-debug-local/build/Debug/generators/conan_toolchain.cmake \
                -DCMAKE_PREFIX_PATH=$PWD/build/install/llvm-ninja-debug
          cmake --build build/consumer/llvm-ninja-debug -j 4
          find build/consumer/llvm-ninja-debug -maxdepth 1 -type f -perm -111 \
               -exec {} \;

      # ── (a) 通用绿色硬门禁: 失败则整个 job 失败 ──
      - name: Run green-label tests (blocking)
        run: |
          ctest --test-dir build/llvm-ninja-debug-local \
                -L ci_required \
                --output-on-failure -j 4

      # ── (b) 全量 unit 分区：稳定的细粒度回归门禁 ──
      - name: Run unit partitions (blocking)
        run: |
          ctest --test-dir build/llvm-ninja-debug-local \
                -L unit \
                --output-on-failure -j 4
